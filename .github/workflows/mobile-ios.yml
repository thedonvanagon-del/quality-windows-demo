name: mobile ios

# Builds the LockBox iPhone app (mobile/) on a Mac runner. By hand only:
# macOS minutes count ten times against a private repo's free minutes.
#
# Always: a simulator build, unsigned, to prove the project compiles.
# With "release" ticked: an App Store build, signed by Xcode's automatic
# signing through an App Store Connect API key, uploaded to App Store Connect
# (it shows up in TestFlight). That part skips itself (a note, not a
# failure) until these secrets exist:
#   ASC_KEY_ID          the API key's Key ID (App Store Connect → Users and Access → Integrations)
#   ASC_ISSUER_ID       the Issuer ID on the same page
#   ASC_KEY_P8_BASE64   the downloaded AuthKey_<id>.p8, base64 -w0 (or base64 -i on a Mac)
#   APPLE_TEAM_ID       the 10-character Team ID (developer.apple.com → Membership)
# The key needs the App Manager role (Admin also works) so Xcode can make the
# certificate and profile itself. mobile/README.md has the steps.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also archive and upload to App Store Connect (TestFlight)"
        type: boolean
        default: false
      version_name:
        description: "Version shown in the store (like 1.0.0)"
        type: string
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: simulator build (unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: install
        run: npm ci

      - name: config checks
        run: npm test

      # Swift Package Manager, not CocoaPods: no pod install.
      - name: sync the native project
        run: npx cap sync ios

      - name: build for the simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    name: App Store build
    if: inputs.release
    needs: simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: are the App Store Connect secrets there?
        id: secrets
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::No App Store build: these secrets aren't set yet:$missing (mobile/README.md has the steps)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: install and sync
        if: steps.secrets.outputs.ready == 'true'
        working-directory: mobile
        run: |
          npm ci
          npx cap sync ios

      - name: archive
        if: steps.secrets.outputs.ready == 'true'
        working-directory: mobile
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LockBox.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      # destination "upload" sends the build straight to App Store Connect.
      - name: export and upload
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LockBox.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"
          echo "::notice::Uploaded. It shows in App Store Connect → TestFlight after Apple processes it (usually 10 to 30 minutes)."
