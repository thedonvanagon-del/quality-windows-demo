name: cfb-bot

# Scans live college football every 30 minutes on Saturdays and posts in-play
# bets to Telegram. Setup and tuning live in cfb-bot/README.md.

on:
  schedule:
    # GitHub cron is UTC and best effort: on the first Saturday it ran 4 of
    # about 20 slots. So these only need to start a run. A run keeps scanning
    # every 30 minutes on its own (11am to 4:30am Eastern) and starts the next
    # run before GitHub's 6-hour job limit. While one is going, these queue
    # behind it and exit right away once the window has closed.
    - cron: "7,37 15-23 * * 6"
    - cron: "7,37 0-8 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [loop, scan, dry-run, test-telegram]
        default: loop

permissions:
  contents: read
  actions: write  # a run starts the next one before the 6-hour limit

# One run at a time, so two never fight over the state file.
concurrency:
  group: cfb-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pregame lines and picks already sent carry over between runs in the
      # Actions cache. Each run saves under a new key; restore takes the newest.
      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: cfb-bot/state
          key: cfb-bot-state-${{ github.run_id }}
          restore-keys: cfb-bot-state-

      - name: scan
        id: scan
        working-directory: cfb-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFB_BOOKMAKERS: ${{ vars.CFB_BOOKMAKERS }}
          CFB_SPREAD_EDGE: ${{ vars.CFB_SPREAD_EDGE }}
          CFB_TOTAL_EDGE: ${{ vars.CFB_TOTAL_EDGE }}
          CFB_HEARTBEAT: ${{ vars.CFB_HEARTBEAT }}
          MODE: ${{ inputs.mode || 'loop' }}
        run: |
          case "$MODE" in
            dry-run) python -m cfbbot --dry-run ;;
            test-telegram) python -m cfbbot --test-telegram ;;
            scan) python -m cfbbot ;;
            *) python -m cfbbot --loop ;;
          esac

      - name: save state
        if: always() && hashFiles('cfb-bot/state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: cfb-bot/state
          key: cfb-bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      # The loop hit its time budget with games still going: start a fresh
      # run. It queues behind this one and picks up the saved state.
      - name: keep going
        if: steps.scan.outputs.again == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: gh workflow run cfb-bot.yml --ref "$REF" -f mode=loop
