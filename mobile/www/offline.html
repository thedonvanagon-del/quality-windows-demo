<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LockBox</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a1228; color: #f2f4f8; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px max(24px, env(safe-area-inset-right)) 24px max(24px, env(safe-area-inset-left));
    box-sizing: border-box; text-align: center;
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  img { width: 120px; height: auto; }
  h1 { margin: 6px 0 0; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; }
  .by { margin: -10px 0 8px; color: #ffb020; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
  p { margin: 0; max-width: 22em; color: #a3b2d6; }
  button {
    margin-top: 10px; min-width: 180px; padding: 14px 22px; border: 0; border-radius: 12px;
    background: #ffb020; color: #1a1000; font: inherit; font-weight: 700; cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  button[disabled] { opacity: 0.6; }
</style>
</head>
<body>
  <img src="crest.png" alt="" width="120" height="119">
  <h1>LockBox</h1>
  <div class="by">BY BOOKIEBULLIES.COM</div>
  <p>No connection. LockBox needs the internet to load your board.</p>
  <button type="button" id="retry">Try again</button>
  <script>
    // Shown by Capacitor (server.errorPath) when the site doesn't load. It
    // has no plugins on Android, so it only knows the site's address.
    var SITE = 'https://app.bookiebullies.com/';
    var button = document.getElementById('retry');
    function retry() {
      button.disabled = true;
      button.textContent = 'Loading…';
      window.location.replace(SITE);
    }
    button.addEventListener('click', retry);
    // Back online: try on its own.
    window.addEventListener('online', retry);
  </script>
</body>
</html>
