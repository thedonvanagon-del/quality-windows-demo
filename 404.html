<style>
  :root{
    --orange:#FF7A00;
    --cream:#FFF1D8;
    --ink:#1E1410;
    --ink-soft:#3B2A20;
    --blood:#C0392B;
    --font-display:"Bowlby One","Rubik",system-ui,sans-serif;
    --font-body:"Rubik",system-ui,-apple-system,sans-serif;
    --pop:7px 7px 0 var(--ink);
    --pop-sm:4px 4px 0 var(--ink);
    --ease:cubic-bezier(.22,.61,.36,1);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:var(--orange);color:var(--ink);
    font-family:var(--font-body);font-size:17px;line-height:1.6;
    padding:48px 24px;overflow-x:hidden;
  }
  svg{display:block;max-width:100%}
  .box{max-width:560px;text-align:center}
  .eyes{width:min(340px,80vw);height:auto;margin:0 auto 34px;filter:drop-shadow(8px 10px 0 var(--ink))}
  h1{
    font-family:var(--font-display);font-weight:400;font-size:clamp(34px,6vw,58px);
    line-height:.98;letter-spacing:.005em;margin:0 0 16px;text-transform:uppercase;text-wrap:balance;
  }
  p{margin:0 0 30px;color:var(--ink-soft);font-size:18px}
  .btn{
    display:inline-flex;align-items:center;padding:14px 26px;border-radius:999px;
    background:var(--ink);color:var(--cream);text-decoration:none;font-weight:700;font-size:15px;
    border:3px solid var(--ink);box-shadow:var(--pop-sm);
    transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s;
  }
  .btn:hover{transform:translate(-2px,-2px);box-shadow:var(--pop);background:var(--blood)}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.btn:hover{transform:none}}
</style>
